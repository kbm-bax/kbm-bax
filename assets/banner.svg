<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Muthukumar KB, infrastructure and platform engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="48%" stop-color="#10182b"/>
      <stop offset="100%" stop-color="#1c140d"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6842"/>
      <stop offset="45%" stop-color="#f0d2a8"/>
      <stop offset="100%" stop-color="#c9956a"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#f6f1e7" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#brass)"/>

  <g fill="none" stroke="#d4a574" stroke-opacity="0.45">
    <circle cx="1010" cy="158" r="108" stroke-width="1"/>
    <circle cx="1010" cy="158" r="74" stroke="#f6f1e7" stroke-opacity="0.14"/>
    <circle cx="1010" cy="158" r="38" stroke-opacity="0.7"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 1010 158" to="360 1010 158" dur="22s" repeatCount="indefinite"/>
    <circle cx="1118" cy="158" r="4.5" fill="#f0d2a8"/>
    <circle cx="1010" cy="50" r="3" fill="#f6f1e7" fill-opacity="0.8"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 1010 158" to="0 1010 158" dur="14s" repeatCount="indefinite"/>
    <circle cx="936" cy="158" r="3.2" fill="#c9956a"/>
  </g>
  <circle cx="1010" cy="158" r="5" fill="#f6f1e7"/>

  <text x="72" y="108" fill="#d4a574" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="5.5">BANGALORE</text>
  <text x="196" y="108" fill="#8d877c" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3.2">PLATFORM  /  DATA  /  WEB</text>

  <text x="70" y="176" fill="#f6f1e7" font-family="'Liberation Serif', Georgia, 'Iowan Old Style', Palatino, serif" font-size="62">Muthukumar KB</text>
  <text x="72" y="216" fill="#c8c2b4" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="18">Infrastructure, platform engineering, and the systems underneath.</text>

  <rect x="72" y="246" width="148" height="3" fill="url(#brass)"/>
  <text x="72" y="278" fill="#8d877c" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.4">kbm-bax</text>
</svg>
